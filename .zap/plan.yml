env:
  contexts:
    - name: Authenticated
      urls:
        - ${TARGET}
      includePaths:
        - ${TARGET}.*
      excludePaths:
        - ${TARGET}/logout
      authentication:
        method: browser
        parameters:
          loginPageUrl: ${TARGET}
          loginPageWait: 10
          browserId: firefox-headless
          stepDelay: 0
          diagnostics: false
          steps: []
        verification:
          method: poll
          loggedInRegex: \QSign out\E
          pollFrequency: 60
          pollUnits: requests
          pollUrl: ${TARGET}
          pollPostData: ""
      sessionManagement:
        method: cookie
      technology:
        exclude:
          - C
          - SQLite
          - CouchDB
          - XML
          - Microsoft SQL Server
          - MongoDB
          - SAP MaxDB
          - SVN
          - WS
          - Framework
          - Sybase
          - Python
          - ASP
          - OS
          - IBM DB2
          - PHP
          - MariaDB
          - Oracle
          - JSP/Servlet
          - Firebird
          - HypersonicSQL
          - MySQL
          - Ruby
          - Microsoft Access
          - Java
      structure: {}
      users:
        - name: alice
          credentials:
            password: password
            username: alice
        - name: bob
          credentials:
            password: password
            username: bob
  parameters: {}
jobs:
  - type: alertFilter
    alertFilters:
      - ruleId: 10116
        ruleName: ZAP is Out of Date (10116)
        newRisk: Info
  - type: passiveScan-config
    parameters: {}
  - type: spiderClient
    parameters:
      context: Authenticated
      user: alice
      url: ${TARGET}
      maxDuration: 0
      maxChildren: 0
      initialLoadTime: 10
      pageLoadTime: 2
  - type: script
    parameters:
      action: "add"
      type: "standalone"
      engine: "ECMAScript : Graal.js"
      name: "count-usable-nodes"
      inline: |
        // Based on https://github.com/zaproxy/community-scripts/blob/main/standalone/Traverse%20sites%20tree.js
        var usable = 0;

        function walk(node) {
          for (var i = 0; i < node.getChildCount(); i++) {
            var child = node.getChildAt(i);
            if (child.isIncludedInScope()) {
              var ref = child.getHistoryReference();
              if (ref != null) {
                var msg = ref.getHttpMessage();
                if (msg != null) {
                  usable++;
                }
              }
            }
            walk(child);
          }
        }

        var root = org.parosproxy.paros.model.Model
          .getSingleton()
          .getSession()
          .getSiteTree()
          .getRoot();

        walk(root);

        print("USABLE NODES: " + usable);
  - type: script
    parameters:
      action: "run"
      type: "standalone"
      name: "count-usable-nodes"
  - type: passiveScan-wait
    parameters: {}
  - type: activeScan
    parameters:
      context: Authenticated
      user: alice
      url: ${TARGET}
      maxScanDurationInMins: 20
    policyDefinition:
      defaultStrength: medium
      defaultThreshold: medium
  - type: report
    parameters:
      template: traditional-html
      theme: null
      reportTitle: ZAP by Checkmarx Scanning Report
    risks:
      - low
      - medium
      - high
    confidences:
      - low
      - medium
      - high
      - confirmed
  - type: exitStatus
    parameters:
      errorLevel: Medium
      warnLevel: Low